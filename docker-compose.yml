services:
  db:
    image: postgres:16-alpine
    container_name: garagemcar-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: garagemcar
      POSTGRES_PASSWORD: garagemcar
      POSTGRES_DB: garagemcar
    ports:
      - "5433:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U garagemcar -d garagemcar"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build:
      context: ./frontend
    container_name: garagemcar-web
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://garagemcar:garagemcar@db:5432/garagemcar
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
